
name: Format Algorithm Issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  format-issue:
    if: startsWith(github.event.issue.body, '### 문제 사이트')
    runs-on: ubuntu-latest

    steps:
      - name: Format issue body
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            function getField(label) {
              const heading = `### ${label}\n`;
              const section = body.split(heading)[1];

              return section
                ?.split(/\n### /)[0]
                .trim() || "";
            }

            const platform = getField("문제 사이트");
            const name = getField("문제 이름");
            const url = getField("문제 링크");
            const number = getField("문제 번호");

            if (
              !["프로그래머스", "SWEA", "코드트리"]
                .includes(platform) ||
              !name || !url || !number
            ) {
              return;
            }

            const lines = [
              "## 문제",
              `- 문제 사이트: ${platform}`,
              `- 문제 이름: [${name}](${url})`,
              `- 문제 번호: ${number}`,
              "",
              "### 문제 풀이 템플릿",
              "```",
              "### 시간복잡도 생각해보기",
              "- ",
              "",
              "### 풀이 아이디어",
              "- ",
              "",
              "### 의사코드 / 풀이 과정",
              "- ",
              "",
              "```"
            ];

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: lines.join("\n")
            });

