
name: 문제 풀이 템플릿
description: 알고리즘 스터디 문제를 등록합니다.
title: "[N주차 - M] 문제 이름"

body:
  - type: dropdown
    id: platform
    attributes:
      label: 문제 사이트
      options:
        - 프로그래머스
        - SWEA
        - 코드트리
    validations:
      required: true

  - type: input
    id: problem-name
    attributes:
      label: 문제 이름
      placeholder: "예: 줄 세우기"
    validations:
      required: true

  - type: input
    id: problem-url
    attributes:
      label: 문제 링크
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: problem-number
    attributes:
      label: 문제 번호
      placeholder: "예: S3952, P42860, CT6C3P5"
    validations:
      required: true

